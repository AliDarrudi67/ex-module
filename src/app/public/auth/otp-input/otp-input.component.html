<div class="flex flex-col items-center justify-center">
    <ng-otp-input #otpInput [config]="{length: 6, allowNumbersOnly: true, inputClass: 'otp-input-small'}" dir="ltr"
        (onInputChange)="checkCode($event)">
    </ng-otp-input>

    <!-- تایمر / ارسال مجدد -->
    <div class="mt-2 text-sm text-gray-600">
        <span class="dark:text-white" *ngIf="!showResend">ارسال مجدد در {{ timer }} ثانیه</span>
        <button *ngIf="showResend" type="button" class="text-[#34d399] hover:underline" (click)="resendOtp()">
            ارسال مجدد
        </button>
    </div>
</div>
