<div class="w-full">
        <!-- Header -->
    <div class="flex items-center justify-between mb-2">
        <h3 class="font-semibold text-white">Order Book</h3>
        <span class="text-gray-400 text-xl cursor-pointer">⋯</span>
    </div>
    <div class="border-b border-gray-700 mb-3"></div>

    <!-- Controls row -->
    <div class="flex items-center justify-between mb-3">
        <!-- Layout icons -->
        <div class="flex items-center space-x-2 text-gray-400">
            <span class="cursor-pointer hover:text-white">
                <img src="assets/img/icon/orderBookType1.png" />
            </span>
            <span class="cursor-pointer hover:text-white">
                <img src="assets/img/icon/orderBookType2.png" />
            </span>
            <span class="cursor-pointer hover:text-white">
                <img src="assets/img/icon/orderBookType3.png" />
            </span>
        </div>

        <!-- Depth selector -->
        <div class="flex items-center space-x-1 text-white">
            <span class="text-xs">0.01</span>
            <span class="text-gray-400 text-xs cursor-pointer">
                <img src="assets/img/icon/downArrow.png" />
            </span>
        </div>
    </div>

    <!-- Table header -->
    <div class="grid grid-cols-3 text-gray-400 text-xs mb-1">
        <div>Price (USDT)</div>
        <div class="text-right">Amount (BTC)</div>
        <div class="text-right">Total</div>
    </div>

    <!-- 🔻 Sell Orders -->
    <div class="space-y-1 mb-3">
        <div class="grid grid-cols-3 text-sm" *ngFor="let item of [].constructor(18)">
            <div class="text-red-400">63,520</div>
            <div class="text-right text-white">0.154</div>
            <div class="text-right text-white">9.76</div>
        </div>
    </div>

    <!-- Current Price Row -->
    <div class="flex items-center justify-between my-3">
        <div class="flex items-center space-x-2">
            <span class="text-green-400 text-lg font-semibold">63,500</span>
            <span class="text-green-400 text-xs">
                <img src="assets/img/icon/upArrow.png" />
            </span>
            <span class="text-white text-xs">$63,500.00</span>
        </div>
        <span class="text-gray-400 text-sm cursor-pointer">
            <img src="assets/img/icon/rightArrow.png" />
        </span>
    </div>

    <!-- 🔺 Buy Orders -->
    <div class="space-y-1 mb-4">
        <div class="grid grid-cols-3 text-sm" *ngFor="let item of [].constructor(18)">
            <div class="text-green-400">63,495</div>
            <div class="text-right text-white">0.540</div>
            <div class="text-right text-white">34.2</div>
        </div>
    </div>

    <!-- Buy/Sell Ratio Bar -->
    <div class="flex items-center justify-between text-xs font-medium gap-2">
        <span class="text-white">B</span>
        <span class="text-green-400">65%</span>

        <div class="flex items-center flex-1 mx-2 space-x-1">
            <div class="h-1.5 bg-green-500 rounded-l-full" style="width: 65%;"></div>
            <div class="h-1.5 bg-red-500 rounded-r-full flex-1"></div>
        </div>

        <span class="text-red-400">35%</span>
        <span class="text-white">S</span>
    </div>

</div>
