<div class="flex-1 flex items-center justify-center bg-[#161516]  border border-[#484848] rounded-lg mb-3">
    <!-- TradingView Chart Placeholder -->
    <div class="flex flex-col space-y-2 w-full">
        <!-- انتخاب شبکه -->
        <div class="flex items-center gap-2">
            <label class="text-gray-400 text-sm">Network:</label>
            <select class="bg-gray-800 text-white px-2 py-1 rounded" [(ngModel)]="selectedNetwork">
                <option *ngFor="let net of networks" [value]="net">{{ net }}</option>
            </select>
        </div>

        <img src="assets/img/trading-view.jpg" />
    </div>
</div>
