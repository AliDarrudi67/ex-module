<div class="flex items-center justify-between px-6 py-3 border border-[#3B3B3B] bg-[#161516] mt-1 mb-3 rounded relative"
    dir="ltr">
    <!-- Left section -->
    <div class="flex flex-col md:flex-row md:items-center gap-5">
        <div class="flex items-center gap-2">
            <!-- Star icon -->
            <img src="assets/img/icon/star.png" alt="BTC" class="w-6 h-6" />

            <!-- Pair info -->
            <div class="flex items-center gap-2">
                <!-- Bitcoin icon -->
                <img src="assets/img/icon/btc.png" alt="BTC" class="w-6 h-6" />

                <div class="flex flex-col">
                    <div class="flex items-center space-x-2">
                        <h2 class="text-lg font-semibold text-white">BTC / USDT</h2>
                    </div>
                    <div class="flex items-center space-x-1 text-gray-400 text-xs">
                        <span>Bitcoin Price</span>
                        <a href="#" class="text-[#4073D0] hover:underline">↗</a>
                    </div>
                </div>
            </div>

            <!-- Price info -->
            <div class="ml-8">
                <div class="text-green-400 text-xl font-semibold">$63,500</div>
                <div class="text-white text-sm">$63,500.00</div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <div class="text-right">
                <div class="text-gray-400 text-xs">24h Chg</div>
                <div class="text-red-400 font-medium">-1.25%</div>
            </div>

            <div class="text-right">
                <div class="text-gray-400 text-xs">24h High</div>
                <div class="text-white font-medium">63,900</div>
            </div>

            <div class="text-right">
                <div class="text-gray-400 text-xs">24h Low</div>
                <div class="text-white font-medium">62,750</div>
            </div>

            <div class="text-right">
                <div class="text-gray-400 text-xs">24h Volume (BTC)</div>
                <div class="text-white font-medium">2,356</div>
            </div>

            <div class="text-right">
                <div class="text-gray-400 text-xs">24h Volume (USDT)</div>
                <div class="text-white font-medium">148M</div>
            </div>
        </div>

        <div class="text-left">
            <div class="text-gray-400 text-xs mb-1">Networks</div>
            <div class="text-white font-medium border-t border-dashed border-white/30 pt-1 text-xs">BTC / BSC / ETH
            </div>
        </div>
    </div>

    <lucide-icon name="menu" (click)="toggleSidebar()"
        class="text-white cursor-pointer absolute right-[5px] top-[5px]"></lucide-icon>
</div>
