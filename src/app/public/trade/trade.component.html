<div *ngIf="showSidebar" class="fixed inset-0 z-[1000] bg-black/50 backdrop-blur-sm" (click)="toggleSidebar()">
</div>
<div class="flex flex-col bg-[#161516] text-gray-100 p-2">
    <app-sidebar [showInTrade]="true" (hideSidebar)="toggleSidebar()"
        class="w-[350px] fixed left-[unset] right-0 z-[1001] top-0 transition-all duration-300"
        [ngClass]="showSidebar?'show':'hide'" id="sidebar"></app-sidebar>

    <!-- 🔹 Header Info Bar -->
    <app-trade-header (changeSidebar)="toggleSidebar()"></app-trade-header>

    <!-- Mobile Horizontal Tabs -->
    <div class="lg:hidden overflow-x-auto border-b border-gray-700 bg-[#161516]">
        <div class="flex w-max">
            <button *ngFor="let tab of mobileTabs" (click)="selectTab(tab.key)"
                [class.text-[#59AFBE]]="activeTab === tab.key"
                class="px-4 py-3 whitespace-nowrap hover:text-[#59AFBE] transition-colors duration-200">
                {{ tab.label }}
            </button>
        </div>
    </div>

    <!-- 🔸 Main Content -->
    <div class="flex flex-col lg:flex-row overflow-hidden">
        <!-- Left: Order Book -->
        <!-- 🔹 ORDER BOOK -->
        <div class="w-full lg:w-1/4 border border-[#484848] rounded-lg p-4 text-sm text-gray-100"
            [ngClass]="(activeTab!=='orderBook' && isMobileWidth)?'hidden':''">
            <app-order-book></app-order-book>
        </div>


        <!-- Center: Chart -->
        <div class="flex-1 flex flex-col px-2" [ngClass]="(activeTab!=='chart' && isMobileWidth)?'hidden':''">
            <app-trade-chart></app-trade-chart>

            <!-- Tabs under chart -->
            <app-trade-panel></app-trade-panel>
        </div>

        <!-- Right: Market Info -->
        <div class="w-full lg:w-1/4">
            <app-search [ngClass]="(activeTab!=='search' && isMobileWidth)?'hidden':''"></app-search>
            <app-market-trades [ngClass]="(activeTab!=='market' && isMobileWidth)?'hidden':''"></app-market-trades>
            <app-top-movers [ngClass]="(activeTab!=='topMover' && isMobileWidth)?'hidden':''"></app-top-movers>
        </div>
    </div>

    <app-orders></app-orders>
</div>
