<div class="border border-[#484848] rounded-lg p-3 mt-3">
    <!-- Header -->
    <div class="flex items-center justify-between mb-2">
        <h3 class="text-sm font-semibold text-white">Top Movers</h3>
        <img src="assets/img/icon/arrowDownDouble.png" />
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-700 mb-3"></div>

    <!-- Slider menu -->
    <div class="relative"> <!-- فاصله چپ و راست -->
        <app-slider [arrowSize]="20" [slidesPerView]="5" [itemsCount]="topMovers.length" class="z-[2]">
            <div class="swiper-slide text-gray-400 text-sm px-4 py-2 rounded-md cursor-pointer hover:text-white"
                *ngFor="let item of topMovers">
                <p>
                    {{item}}
                </p>
            </div>
        </app-slider>
    </div>

    <!-- Table -->
    <div class="space-y-2">
        <!-- Row -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-2"
            *ngFor="let item of [].constructor(2)">
            <!-- Left cell -->
            <div>
                <div class="text-white text-sm font-medium">ZK / BTC</div>
                <div class="text-gray-400 text-xs">14:25:43</div>
            </div>

            <!-- Right cell -->
            <div class="flex items-center gap-2">
                <div class="text-right">
                    <div class="text-green-400 text-sm font-medium">+5.23%</div>
                    <div class="text-gray-400 text-xs">New 24hr High</div>
                </div>
                <button
                    class="bg-green-600 hover:bg-green-700 text-white text-xs rounded-md flex items-center px-2 py-1 gap-1">
                    <img src="assets/img/icon/dashArrowDash.png" />
                </button>
            </div>
        </div>
    </div>
</div>
