<div class="flex w-full bg-[#E5E7EB] dark:bg-[#334155] min-h-screen" dir="rtl">
  <!-- Sidebar -->
  <div class="w-[0px] z-[999] transition-all duration-300 ease-in-out"
    [ngClass]="sidebarOpen || !floatedSidebar?'lg:w-[338px]':'lg:w-[100px]'">
    <app-sidebar (showSidebar)="floatSidebar($event)" (hideSidebar)="sidebarOpen = !sidebarOpen"
      (sidebarMode)="changeSidebarMode($event)" (mouseleave)="changeSidebarMode('close')"
      class="fixed top-0 overflow-auto min-h-screen  rtl-sidebar right-0 transition-all duration-300 ease-in-out"
      [ngClass]="sidebarOpen|| !floatedSidebar?'w-[368px]':'w-[100px]'" [sidebarOpen]="sidebarOpen|| !floatedSidebar"
      [class.open]="sidebarOpen|| !floatedSidebar">
    </app-sidebar>
  </div>

  <!-- Overlay -->
  <div *ngIf="sidebarOpen && isMobile" class="fixed inset-0 z-[998] bg-black/50 backdrop-blur-sm"
    (click)="sidebarOpen = !sidebarOpen">
  </div>

  <!-- Main content -->
  <div class="flex flex-col flex-1 relative" id="dynamicSection">
    <app-header class="sticky  top-[10px] left-0 z-[333] w-full transition-all duration-300 ease-in-out"
      (showSidebar)="changeSidebarMode('open')">
    </app-header>
    <!-- محتوا -->
    <div class="p-4 lg:p-8 en w-full flex flex-col gap-3">
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
