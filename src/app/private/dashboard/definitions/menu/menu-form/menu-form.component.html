<app-form-container [title]="formTitle">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" dir="rtl" class="flex flex-col gap-9 p-5">

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نام منو</mat-label>
            <input matInput type="text" formControlName="slug" />
            <mat-error *ngIf="form.get('slug')?.hasError('required')">نام منو اجباری است</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>مسیر</mat-label>
            <mat-select matInput formControlName="route">
                <mat-option *ngFor="let item of routes" [value]="item">{{item?.description}}</mat-option>
            </mat-select>
        </mat-form-field>

        <div class="flex items-center gap-3">
            <mat-form-field appearance="outline" class="w-full relative">
                <mat-label>ایکن</mat-label>
                <input matInput class="!pl-[25px]" type="text" dir="ltr" formControlName="icon" readonly />
                <lucide-icon class="absolute left-[-5px] top-[5px] dark:text-white"
                    name="{{form.value.icon}}"></lucide-icon>
                <mat-error *ngIf="form.get('icon')?.hasError('required')">ایکن اجباری است</mat-error>
            </mat-form-field>

            <app-button action="secondary" title="انتخاب ایکن" (click)="openIconPicker()"></app-button>
        </div>


        <mat-form-field appearance="outline" class="w-full" *ngIf="data?.name">
            <mat-label>وضعیت</mat-label>
            <mat-select matInput formControlName="status">
                <mat-option *ngFor="let item of statusList" [value]="item.value">{{item.text}}</mat-option>
            </mat-select>
        </mat-form-field>

        <app-form-footer [form]="form"></app-form-footer>

    </form>
</app-form-container>
