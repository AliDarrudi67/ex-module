<app-form-container [title]="formTitle" [formLoading]="formLoading">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" dir="rtl" class="flex flex-col gap-9 p-5"
        [ngClass]="formLoading?'disabled-form':''">

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نوع محاسبه برداشت</mat-label>
            <mat-select formControlName="typeCalcWithdraw">
                <mat-option *ngFor="let item of typeCalcList" [value]="item.value">
                    {{ item.text }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Gas</mat-label>
            <input matInput formControlName="gas" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>حداکثر Gas</mat-label>
            <input matInput formControlName="maxGasFee" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>تخفیف انتقال داخلی</mat-label>
            <input matInput formControlName="disCountInternalTransfer" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نوع کارمزد (Gits Fee)</mat-label>
            <mat-select formControlName="gitsFee" multiple>
                <mat-option *ngFor="let item of gitsFeeList" [value]="item.value">
                    {{ item.text }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-checkbox color="primary" formControlName="useRatio">
            استفاده از ضریب معماری؟
        </mat-checkbox>


        <app-form-footer [loading]="loading" [form]="form"></app-form-footer>
    </form>
</app-form-container>
