<app-form-container [title]="formTitle" [formLoading]="formLoading">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" dir="rtl" class="flex flex-col gap-9 p-5"
        [ngClass]="formLoading?'disabled-form':''">

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نام دارایی</mat-label>
            <input matInput type="text" formControlName="slug" dir="ltr" />
            <mat-error *ngIf="form.get('slug')?.hasError('required')">نام دارایی اجباری است</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نماد</mat-label>
            <input matInput type="text" formControlName="symbol" dir="ltr" />
            <mat-error *ngIf="form.get('symbol')?.hasError('required')">نماد اجباری است</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نمایش اعشار</mat-label>
            <input matInput numericOnly formControlName="decimalDisplay" dir="ltr" />
            <mat-error *ngIf="form.get('decimalDisplay')?.hasError('required')">نمایش اعشار اجباری است</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نوع</mat-label>
            <mat-select matInput formControlName="typeAsset">
                <mat-option *ngFor="let item of typeAssets"
                    [value]="item.value">{{item.value}}({{item.text}})</mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('type')?.hasError('required')">نوع اجباری است</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full" *ngIf="data?.assetId">
            <mat-label>وضعیت</mat-label>
            <mat-select matInput formControlName="status">
                <mat-option *ngFor="let item of statusList" [value]="item.value">{{item.text}}</mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('status')?.hasError('required')">وضعیت اجباری است</mat-error>
        </mat-form-field>

        <mat-checkbox color="primary" formControlName="isStableCoin">
            ارز پایدار
        </mat-checkbox>

        <app-form-footer [loading]="loading" [form]="form"></app-form-footer>
    </form>
</app-form-container>
