<app-form-container [title]="formTitle" [formLoading]="formLoading">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" dir="rtl" class="flex flex-col gap-9 p-5"
        [ngClass]="formLoading?'disabled-form':''">

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>انتخاب گروه دارایی</mat-label>
            <mat-select matInput formControlName="groupSectionId">
                <mat-option *ngFor="let item of groupSections" [value]="item.groupAssetId">{{item.slug}}</mat-option>
            </mat-select>
        </mat-form-field>

        <app-form-footer [loading]="loading" [form]="form"></app-form-footer>
    </form>

</app-form-container>
