<app-form-container [title]="formTitle" [formLoading]="formLoading">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" dir="rtl" class="flex flex-col gap-9 p-5"
        [ngClass]="formLoading?'disabled-form':''">

        <app-async-select (onSelectItem)="setFrom($event)" endpoint="{{listEndpoint}}" valueField="gitWalletId"
            *ngIf="listEndpoint" placeholder="مبدا" textField="slug"></app-async-select>
        <app-async-select (onSelectItem)="setTo($event)" endpoint="{{listEndpoint}}" valueField="gitWalletId"
            *ngIf="listEndpoint" placeholder="مقصد" textField="slug"></app-async-select>

        <app-form-footer [form]="form" [loading]="loading"></app-form-footer>
    </form>

</app-form-container>
