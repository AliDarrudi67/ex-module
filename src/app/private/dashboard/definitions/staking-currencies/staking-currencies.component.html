<ng-template #periodsButton let-row>
  <app-button classList="!min-w-[unset]" title="دوره ها"
    routerLink="/dashboard/definitions/staking-currencies/{{row?.id}}/periods"></app-button>
</ng-template>

<app-grid 
[columns]="columns"
(newRecord)="addNewRecord()"
(editRecord)="editRecord($event)"
[columnTemplates]="{ 'periods': [periodsButton]}"
></app-grid>
