<app-form-container [title]="formTitle" [formLoading]="formLoading">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" dir="rtl" class="flex flex-col gap-9 p-5"
        [ngClass]="formLoading?'disabled-form':''">

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>آدرس ایمیل</mat-label>
            <input matInput type="text" formControlName="email" dir="ltr" />
            <mat-error *ngIf="form.get('email')?.hasError('required')">
                ایمیل الزامی است
            </mat-error>
            <mat-error *ngIf="form.value.email && form.get('email')?.hasError('gmailInvalid')">
                فقط آدرس‌های Gmail معتبر هستند
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full" *ngIf="data?.smtpCenterId">
            <mat-label>وضعیت</mat-label>
            <mat-select matInput formControlName="status">
                <mat-option *ngFor="let item of statusList" [value]="item.value">{{item.text}}</mat-option>
            </mat-select>
        </mat-form-field>

        <app-form-footer [loading]="loading" [form]="form"></app-form-footer>

    </form>
</app-form-container>
