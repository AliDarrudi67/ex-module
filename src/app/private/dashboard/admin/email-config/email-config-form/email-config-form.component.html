<app-form-container [title]="formTitle" [formLoading]="formLoading">

    <form [formGroup]="form" (ngSubmit)="onSubmit()" dir="rtl" class="flex flex-col gap-9 p-5"
        [ngClass]="formLoading ? 'disabled-form' : ''">

        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نام تنظیمات</mat-label>
            <input matInput type="text" formControlName="slug" dir="ltr" />
            <mat-error *ngIf="form.get('slug')?.hasError('required')">نام تنظیمات اجباری است</mat-error>
        </mat-form-field>

        <!-- typeEmail -->
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>نوع ایمیل</mat-label>
            <mat-select formControlName="typeEmail">
                <mat-option *ngFor="let item of emailTypes" [value]="item.value">
                    {{ item.text }}
                </mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('typeEmail')?.hasError('required')">
                نوع ایمیل اجباری است
            </mat-error>
        </mat-form-field>

        <!-- content -->
        <div class="w-full">
            <label class="block mb-2 text-gray-700 dark:text-gray-300">محتوای ایمیل</label>
            <quill-editor [formControl]="contentControl" [modules]="quillModules" [theme]="'snow'"
                placeholder="متن خود را وارد کنید…" class="custom-quill"></quill-editor>
        </div>


        <!-- keysHtml -->
        <mat-form-field appearance="outline">
            <mat-label>کلمات</mat-label>

            <mat-chip-grid #chipList formControlName="keysHtml">
                <mat-chip-row *ngFor="let word of form.get('keysHtml')?.value" [removable]="true"
                    (removed)="remove(word)">
                    {{ word }}
                    <button matChipRemove>✕</button>
                </mat-chip-row>

                <input matInput placeholder="کلمه اضافه کن و Enter بزن" [matChipInputFor]="chipList"
                    [matChipInputSeparatorKeyCodes]="separatorKeys" (matChipInputTokenEnd)="add($event)" />
            </mat-chip-grid>
        </mat-form-field>


        <app-form-footer [loading]="loading" [form]="form">
        </app-form-footer>

    </form>
</app-form-container>
