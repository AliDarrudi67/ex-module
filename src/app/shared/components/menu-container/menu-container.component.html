<div class="flex flex-col gap-5">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 ">
        <div *ngFor="let item of menuItems" [routerLink]="item.route"
            class="group cursor-pointer bg-white border border-gray-200 dark:bg-[#1E293B] dark:border-[#485464] rounded-2xl shadow-sm hover:shadow-md hover:border-emerald-400 transition-all duration-300 p-5 flex flex-col items-center text-center">
            <!-- آیکون -->
            <div
                class="flex items-center justify-center w-14 h-14 rounded-full bg-emerald-50 text-emerald-500 mb-3 group-hover:bg-emerald-100 transition-colors">
                <lucide-icon name="{{ item.icon }}"></lucide-icon>
            </div>

            <!-- عنوان -->
            <h3 class="text-gray-700 dark:text-white font-medium text-lg group-hover:text-emerald-600 transition-colors">
                {{ item.title }}
            </h3>
        </div>
    </div>
</div>

<router-outlet></router-outlet>
