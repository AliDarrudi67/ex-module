<div class="relative w-full" [ngClass]="open?'h-[400px]':''" (click)="$event.stopPropagation()">

    <!-- Selected box -->
    <button type="button" (click)="toggle()"
        class="w-full flex items-center justify-between bg-white dark:bg-transparent border px-3 py-[10px] rounded-[5px] shadow-sm transition">
        <div class="flex items-center gap-2">
            <img *ngIf="selectedCountry" [src]="selectedCountry.flag" class="w-5 h-5 rounded" />
            <span class="text-gray-800 dark:text-gray-200">
                {{ selectedCountry?.name || 'انتخاب کشور' }}
            </span>
        </div>

        <lucide-icon class="dark:text-white" name="chevron-down"></lucide-icon>
    </button>

    <!-- Dropdown -->
    <div class="absolute z-50 left-0 right-0 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg shadow-lg
           origin-top overflow-hidden transition-transform duration-200" [class.scale-y-0]="!open"
        [class.scale-y-100]="open">

        <!-- Search Box -->
        <div class="p-2 sticky top-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
            <input type="text" placeholder="جستجو..." [(ngModel)]="searchValue" (input)="filterCountries()" class="w-full px-3 py-2 rounded-md bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200
               border border-gray-300 dark:border-gray-600 focus:ring-0 focus:outline-none" />
        </div>

        <!-- List -->
        <ul class="max-h-72 overflow-auto">
            <li *ngFor="let country of filterCountries()"
                class="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition"
                (click)="selectCountry(country)">
                <img [src]="country.flag" class="w-5 h-5 rounded" />
                <span class="text-gray-800 dark:text-gray-200">{{ country.name }}</span>
                <span class="ml-auto text-gray-400 dark:text-gray-500 text-sm">{{ country.phone }}</span>
            </li>
        </ul>
    </div>

</div>
