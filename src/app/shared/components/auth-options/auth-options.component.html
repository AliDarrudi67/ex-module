<div class="auth-options">
    @for (option of options; track option.id) {
    <button type="button" class="auth-options__item" (click)="select(option.id)">
        <span class="auth-options__icon" [innerHTML]="safeIcon(option.iconSvg)"></span>
        <span class="auth-options__title">{{ option.title }}</span>
        <span class="auth-options__subtitle">{{ option.subtitle }}</span>
    </button>
    }
</div>
